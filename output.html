<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script>if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) location.replace('https:' + location.href.slice(5));</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ff3b30%22/%3E%3C/svg%3E">
<title>StudioLive · Uscita OBS</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; background: transparent; }
  #tap { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); color: #fff; font: 600 28px -apple-system, Arial; cursor: pointer; }
</style>
</head>
<body>
<video id="v" playsinline autoplay></video>
<div id="tap">Clicca per attivare l’audio</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
  import { ClientSignal } from './lib/net.js';
  import { Peer } from './lib/peer.js';
  import { CONFIG } from './lib/config.js';
  const QS = new URLSearchParams(location.search);
  const v = document.getElementById('v');
  const tap = document.getElementById('tap');
  let peer = null;
  const reset = () => { peer?.close(); peer = null; v.srcObject = null; };
  const play = () => v.play().catch(() => { tap.style.display = 'grid'; });
  tap.onclick = () => { tap.style.display = 'none'; v.play(); };
  const signal = new ClientSignal({
    room: QS.get('r'), role: 'output', key: QS.get('k'), name: 'OBS',
    onMessage: (m) => {
      if (['host-ready', 'host-left', 'host-offline'].includes(m.type)) return reset();
      if (m.type === 'sdp' || m.type === 'ice') {
        if (!peer) peer = new Peer({
          polite: false, iceServers: CONFIG.iceServers,
          // chiediamo alla regia audio stereo ad alta qualità
          opus: 'stereo=1;sprop-stereo=1;maxaveragebitrate=256000;useinbandfec=1;usedtx=0',
          send: (msg) => signal.send(msg),
          onTrack: (e) => { if (v.srcObject !== e.streams[0]) { v.srcObject = e.streams[0]; play(); } },
        });
        peer.handle(m);
      }
    },
  });
</script>
</body>
</html>
